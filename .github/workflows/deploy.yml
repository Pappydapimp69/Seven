name: Deploy MIRAGE to GitHub Pages

# Publishes the repo root as the site root, so the game is playable at
# https://<owner>.github.io/mirage/ . configure-pages(enablement:true) turns
# Pages on the first time this runs, so no manual settings change is needed.
#
# Triggers on push to main AND workflow_dispatch. Unlike Opticon (a multi-branch
# repo where a push trigger on feature branches burned deploy quota on
# guaranteed-fail attempts — the github-pages environment refuses non-default-
# branch deploys), this repo has one branch and one purpose, so push-to-main is
# safe: every push here IS a push to the default branch.
#
# MANUAL RE-DISPATCH — READ BEFORE RETRYING (carried forward from Opticon's own
# deploy workflow, where an unbounded retry habit produced 30 runs in a day and
# ended with the whole site serving origin 404s while every run still reported
# success). A 404 immediately after a successful deploy is usually CDN
# propagation and clears on its own or after ONE re-dispatch — that remedy has a
# ceiling. Distinguish propagation (some edge nodes 404, others serve, a known
# asset may still load — one retry is reasonable) from origin down (root AND a
# known static asset both 404 with age:0 from multiple nodes — more deploys
# cannot fix this; stop and check the repo's Pages settings instead).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Assemble a runtime-only folder rather than uploading the repo root
      # directly — the root also holds docs/, tests/ (including screenshots),
      # and CLAUDE.md, none of which belong on the public site.
      - name: Assemble the site
        run: |
          mkdir -p site
          cp index.html site/
          cp -r css lib src site/

      # Cache-bust EVERY module specifier, not just the entry point — and do it
      # here, on the assembled copy, so the source tree stays no-build and the
      # Node suite goes on importing plain "./state.js" paths.
      #
      # WHY ALL OF THEM. index.html's `src/main.js?v=…` is its own cache entry,
      # but main.js's nested imports ("./state.js", "./percept.js", …) are
      # SEPARATE entries that carried no version at all. Pages serves these with
      # `cache-control: max-age=600`, so a player returning inside that window
      # could get a FRESH main.js resolved against a STALE percept.js. The
      # moment a release adds a new export — exactly what `believedKinds` did —
      # that skew is not a subtle bug, it is an unresolved import: module load
      # fails and the screen stays black.
      #
      # So a PARTIAL bust is worse than none. Left entirely unversioned, the
      # browser at least serves one self-consistent old set that still runs and
      # self-heals in ten minutes. Version them together or not at all.
      - name: Cache-bust every module specifier
        run: |
          set -euo pipefail
          V="${GITHUB_SHA::12}"
          find site/src -name '*.js' -print0 \
            | xargs -0 sed -i -E "s@(from[[:space:]]+[\"'])(\.[^\"']+\.js)([\"'])@\1\2?v=$V\3@g"
          sed -i -E "s@(src=\"src/main\.js)(\?v=[^\"]*)?(\")@\1?v=$V\3@" site/index.html
          sed -i -E "s@(href=\"css/style\.css)(\?v=[^\"]*)?(\")@\1?v=$V\3@" site/index.html
          # Fail the deploy rather than publish a half-rewritten graph.
          if grep -rnE "from[[:space:]]+[\"']\.[^\"']+\.js[\"']" site/src; then
            echo "::error::an import specifier escaped the cache-bust rewrite"
            exit 1
          fi
          echo "cache-busted every specifier at v=$V"

      - name: Upload the site as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
