<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SEVEN</title>
<meta name="description" content="Seven of you set out to walk the trail through the woods.">
<link rel="stylesheet" href="css/style.css?v=seven-1.5.0">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="row"><span id="hud-count"></span><span id="hud-day"></span><span id="hud-clock"></span></div>
  <div class="row small"><span id="hud-area"></span><span id="hud-wood"></span><span id="hud-pile"></span></div>
</div>
<div id="msgs"></div>
<div id="hint"></div>
<div id="prompt"></div>

<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div id="buttons">
    <button data-act="act" class="big">Act</button>
    <button data-act="fire">Fire</button>
    <button data-act="call">Call</button>
    <button data-act="camp">Camp</button>
    <button data-act="rest">Rest</button>
    <button data-act="pause" class="menu">☰</button>
  </div>
</div>

<div id="modal"></div>
<noscript>SEVEN needs JavaScript.</noscript>
<script type="module" src="src/main.js?v=seven-1.5.0"></script>
</body>
</html>
